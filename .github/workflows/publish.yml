name: Publish Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(process.env.GITHUB_REF_TYPE, "tag");
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          NODE

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Bundle Plugin
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp manifest.json release/
          cp icon.png release/
          cp README.md release/
          cp LICENSE release/
          cd release
          zip -r ../logseq-furigana-ruby.zip .

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" logseq-furigana-ruby.zip --clobber
